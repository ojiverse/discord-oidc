[package]
name = "discord-oidc-worker"
description = "Cloudflare Worker OpenID Provider backed by Discord OAuth2"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
oidc-core = { path = "../oidc-core" }
serde.workspace = true
serde_json.workspace = true
getrandom = { version = "0.3", features = ["wasm_js"] }
# workers-rs pulls getrandom 0.2 transitively; it needs its `js` feature
# enabled to compile for wasm32-unknown-unknown.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
url.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
