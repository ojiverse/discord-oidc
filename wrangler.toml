name = "discord-oidc"
main = "crates/discord-oidc-worker/build/worker/shim.mjs"
compatibility_date = "2025-09-01"

# The issuer is served only on the custom domain; workers.dev is disabled.
workers_dev = false
routes = [
  { pattern = "discord.id.ojiver.se", custom_domain = true },
]

[build]
command = "cargo install -q worker-build && worker-build --release crates/discord-oidc-worker"

[vars]
# Non-secret configuration. See docs/DEVELOPMENT.md for the full model.
OIDC_ISSUER_URL = "https://discord.id.ojiver.se"
DISCORD_CLIENT_ID = "1549449390509392013"
DISCORD_REQUIRED_GUILD_ID = "577577973159559219"
# local-dev: post-deploy verification client (public + PKCE, localhost only).
# cloudflare-access: Cloudflare Zero Trust generic OIDC IdP for the OJIverse
# account (confidential, client_secret_basic). Its secret lives in
# OIDC_CLIENT_SECRETS_JSON; without that entry the registry fails validation.
OIDC_CLIENTS_JSON = '[{"client_id":"local-dev","redirect_uris":["http://localhost:8788/callback"],"allowed_scopes":["openid"],"type":"public","token_endpoint_auth_method":"none"},{"client_id":"cloudflare-access","redirect_uris":["https://ojiverse.cloudflareaccess.com/cdn-cgi/access/callback"],"allowed_scopes":["openid"],"type":"confidential","token_endpoint_auth_method":"client_secret_basic"}]'
OIDC_SIGNING_KEY_ID = "prod-key-1"
# OIDC_JWKS_ADDITIONAL_PUBLIC_KEYS = "[]"
# OIDC_ID_TOKEN_TTL_SECONDS = "900"

# Secrets (set via `wrangler secret put` or .dev.vars for local dev):
#   DISCORD_CLIENT_SECRET
#   OIDC_SIGNING_PRIVATE_KEY   (PKCS#8 PEM)
#   OIDC_CLIENT_SECRETS_JSON   ({"client_id": "secret"} for confidential clients)
#   OIDC_ADMIN_API_TOKEN       (bearer token for /admin/clients; unset = admin API disabled)

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "AUTHORIZATION_STATE", class_name = "AuthorizationState" },
  { name = "CLIENT_REGISTRY", class_name = "ClientRegistryState" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthorizationState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ClientRegistryState"]
