[workspace]
resolver = "2"
members = ["crates/oidc-core", "crates/discord-oidc-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ojiverse/discord-oidc"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
subtle = "2"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
